<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>финансер</title>
    <meta
      name="description"
      content="Выписка раскладывается по категориям прямо в браузере. Никуда не отправляется."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="финансер" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Базовая тема светлая: прототип был светлой бумагой, а тёмную сторону
         дизайнер глазами не проверял. Тёмная осталась выбором человека — блок
         `.dark` в токенах, своих цветов не добавлено (Д-017). Поэтому и холст
         под страницей объявлен светлым: у большинства он таким и будет. -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="i/app-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="i/app-180.png" />
    <!--
      Инлайн-скрипта переключения темы здесь нет намеренно: страница остаётся
      без единого инлайн-скрипта — тогда CSP в мета-теге обходится без хешей и
      работает на статик-хостинге, который не даёт править заголовки (Д-012).
      Выбор темы читается из хранилища уже в модуле, первым делом.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
